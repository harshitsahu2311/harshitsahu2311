<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" role="img" aria-label="Terminal about Harshit Sahu">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07140c"/>
      <stop offset="100%" stop-color="#0d1b12"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
      .title { fill: #8b949e; font-size: 13px; }
      .prompt { fill: #3fb950; font-size: 16px; }
      .cmd { fill: #e6edf3; font-size: 16px; }
      .file { fill: #79c0ff; font-size: 16px; }
      .out { fill: #c9d1d9; font-size: 16px; }
      .key { fill: #7ee787; font-size: 16px; }
      .dim { fill: #8b949e; font-size: 16px; }
      .line { opacity: 0; }
      @keyframes show { to { opacity: 1; } }
      .d1 { animation: show 0.01s 0.4s forwards; }
      .d2 { animation: show 0.01s 1.1s forwards; }
      .d3 { animation: show 0.01s 2.0s forwards; }
      .d4 { animation: show 0.01s 2.7s forwards; }
      .d5 { animation: show 0.01s 3.2s forwards; }
      .d6 { animation: show 0.01s 3.7s forwards; }
      .d7 { animation: show 0.01s 4.2s forwards; }
      .d8 { animation: show 0.01s 4.7s forwards; }
      .d9 { animation: show 0.01s 5.2s forwards; }
      .d10 { animation: show 0.01s 5.7s forwards; }
      .d11 { animation: show 0.01s 6.2s forwards; }
      .d12 { animation: show 0.01s 6.7s forwards; }
      .cursor { fill: #3fb950; }
      @keyframes blink { 50% { opacity: 0; } }
      .cursor { animation: blink 1s 7s step-end infinite; }
    </style>
  </defs>

  <rect width="920" height="460" rx="14" fill="url(#bg)" stroke="#238636" stroke-width="2"/>
  <rect x="0" y="0" width="920" height="40" rx="14" fill="#12261a"/>
  <rect x="0" y="26" width="920" height="14" fill="#12261a"/>
  <circle cx="28" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="20" r="6" fill="#27c93f"/>
  <text class="mono title" x="460" y="24" text-anchor="middle">harshit@devops: ~/about  bash</text>

  <text class="mono prompt line d1" x="28" y="78">harshit@devops:~$</text>
  <text class="mono cmd line d1" x="198" y="78">ls</text>

  <text class="mono file line d2" x="28" y="112">about.md</text>
  <text class="mono file line d2" x="160" y="112">harshit_sahu.txt</text>
  <text class="mono file line d2" x="370" y="112">skills.sh</text>
  <text class="mono file line d2" x="500" y="112">stack.yml</text>

  <text class="mono prompt line d3" x="28" y="156">harshit@devops:~$</text>
  <text class="mono cmd line d3" x="198" y="156">cat harshit_sahu.txt</text>

  <text class="mono key line d4" x="28" y="198">Name</text>
  <text class="mono dim line d4" x="88" y="198">:</text>
  <text class="mono out line d4" x="108" y="198">Harshit Sahu</text>

