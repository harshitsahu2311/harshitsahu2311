  <text class="mono dim line d5" x="88" y="226">:</text>
  <text class="mono out line d5" x="108" y="226">DevOps Engineer  |  Cloud Infrastructure  |  Kubernetes  |  CI/CD</text>

  <text class="mono key line d6" x="28" y="254">Cloud</text>
  <text class="mono dim line d6" x="88" y="254">:</text>
  <text class="mono out line d6" x="108" y="254">AWS · Azure · GCP</text>

  <text class="mono key line d7" x="28" y="282">Stack</text>
  <text class="mono dim line d7" x="88" y="282">:</text>
  <text class="mono out line d7" x="108" y="282">Docker · Kubernetes · Jenkins · GitHub Actions · Terraform · Ansible</text>

  <text class="mono key line d8" x="28" y="310">Observe</text>
  <text class="mono dim line d8" x="88" y="310">:</text>
  <text class="mono out line d8" x="108" y="310">Prometheus · Grafana · Linux · Python · Bash</text>

  <text class="mono out line d9" x="28" y="350">I build cloud-native infrastructure that teams can deploy, observe,</text>
  <text class="mono out line d10" x="28" y="378">and trust in production. I enjoy automation, cleaner delivery</text>
  <text class="mono out line d11" x="28" y="406">workflows, and contributing to open-source projects.</text>

  <text class="mono prompt line d12" x="28" y="440">harshit@devops:~$</text>
  <rect class="cursor" x="198" y="426" width="10" height="16"/>
</svg>
