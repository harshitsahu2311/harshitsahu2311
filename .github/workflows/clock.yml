name: Update clock

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Generate IST clock
        run: python3 scripts/generate_clock.py assets/clock.svg

      - name: Commit clock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clock.svg
          if git diff --staged --quiet; then
            echo "Clock already current"
            exit 0
          fi
          git commit -m "Update clock to current IST"
          git push
