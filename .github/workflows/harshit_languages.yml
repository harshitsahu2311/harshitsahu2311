name: WakaTime languages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          GH_TOKEN: ${{ github.token }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          REPOSITORY: harshitsahu2311/harshitsahu2311
          SHOW_TITLE: true
          SECTION_NAME: waka
          CODE_LANG: txt
          TIME_RANGE: all_time
          LANG_COUNT: 10
          SHOW_TIME: true
          SHOW_TOTAL: true
          STOP_AT_OTHER: true
          IGNORED_LANGUAGES: YAML JSON TOML HTML
          COMMIT_MESSAGE: Update WakaTime language stats
          TARGET_BRANCH: main
          TARGET_PATH: README.md
          AUTHOR_NAME: Harshit Sahu
          AUTHOR_EMAIL: harshitsahu2022@gmail.com
